<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="playlist-page">
    <header class="playlist-header">
      <!--mobile header-->
        <div class="mobile-playlists-header">
            <div class="search-playlist">
                <input type="text" placeholder="Search playlist">
                <img src="./assets/icons/library.icons/search.icon.png" alt="search-playlist">
            </div>
            <img class="arrows" src="./assets/icons/playlist.page.icons/arrows.icon.png" alt="align">
        </div>
    </header>
    <main>
      <!--mobile main-->
        <div class="mobile-playlist-main">
            <section class="mix-card-playlist">
                <img src="assets/images/playlist.page/daftpunk.playlist.png" alt="daftpunk-mix">
            </section>
            <!--mix info-->
            <section class="mix-info-box">
                <h1>Daft Punk Mix</h1>
                <div class="mix-info-textbox">
                   <p>By <span>Spotify</span></p>
                   <img src="assets/icons/profile/dot-icon.png" alt="">
                   <p>50 songs</p>
                   <img src="assets/icons/profile/dot-icon.png" alt="">
                   <p>3 hr 30 min</p>
                </div>
                <!--logos for actions-->
                <div class="logos-list-for-playlist">
                <ul class="left-logos-list">
                    <li><img src="assets/icons/playlist.page.icons/add-to-playlist.png" alt=""></li>
                    <li><img src="assets/icons/playlist.page.icons/add-to-queue.png" alt=""></li>
                    <li><img src="assets/icons/playlist.page.icons/download.png" alt=""></li>
                    <li><img src="assets/icons/playlist.page.icons/more.png" alt=""></li>
                </ul>
                <ul class="right-logos-list">
                    <li><img src="assets/icons/playlist.page.icons/shuffle.png" alt=""></li>
                    <li><img src="assets/icons/playlist.page.icons/play.png" alt=""></li>
                </ul>
            </div>
            </section>
            <!--playlist-->
            <section class="playlist-mobile">
                <div class="playlist-song-box">
                    <img src="assets/images/playlist.page/daftpunk.mix.box.png" alt="">
                    <div class="playlist-song-textbox">
                        <h2>Get Lucky</h2>
                        <p>Daft Punk</p>
                    </div>
                    <img class="more-icon" src="assets/icons/playlist.page.icons/more.png" alt="">
                </div>

                <div class="playlist-song-box">
                    <img src="assets/images/playlist.page/daftpunk.mix.box.png" alt="">
                    <div class="playlist-song-textbox">
                        <h2>Instant Crush</h2>
                        <p>Daft Punk, Julian Casablancas</p>
                    </div>
                    <img class="more-icon" src="assets/icons/playlist.page.icons/more.png" alt="">
                </div>

                <div class="playlist-song-box">
                    <img src="assets/images/playlist.page/gorillaz.mix.box.png" alt="">
                    <div class="playlist-song-textbox">
                        <h2>On Melancholy Hill</h2>
                        <p>Gorillaz</p>
                    </div>
                    <img class="more-icon" src="assets/icons/playlist.page.icons/more.png" alt="">
                </div>
                <div class="playlist-song-box">
                    <img src="assets/images/playlist.page/gorillaz.mix.box.png" alt="">
                    <div class="playlist-song-textbox">
                        <h2>On Melancholy Hill</h2>
                        <p>Gorillaz</p>
                    </div>
                    <img class="more-icon" src="assets/icons/playlist.page.icons/more.png" alt="">
            </section>
        </div>
    </main>
    <footer class="player-bar">
        <section class="player-center">
          <div class="player-controls">
            <button class="play-btn">
              <img
                src="assets/icons/player.icons/musicon.icon.png"
                alt="music icon"
              />
            </button>
            <img
              src="assets/icons/player.icons/left.skip.icon.png"
              alt="left skip icon"
            />
            <img
              src="assets/icons/player.icons/right.skip.icon.png"
              alt="right skip icon"
            />
            <img
              src="assets/icons/player.icons/shuffle.icon.png"
              alt="shuffle icon"
            />
            <img
              src="assets/icons/player.icons/replay.icon.png"
              alt="replay icon"
            />
          </div>
          <div class="progress">
            <span>2:23</span>
            <input type="range" />
            <span>4:46</span>
            <img
              src="assets/icons/player.icons/sound.icon.png"
              alt="sound icon"
            />
          </div>
        </section>
        <section class="player-right">
          <img
            src="assets/icons/player.icons/getlucky.png"
            alt="get lucky icon"
          />
          <div class="track-info">
            <h3>Get Lucky</h3>
            <p>Daft punk</p>
            <p>Random Access Memories</p>
          </div>
          <img src="assets/icons/player.icons/heart.icon.png" alt="heart icon" />
          <img src="assets/icons/player.icons/plus.icon.png" alt="plus icon" />
          <img
            src="assets/icons/player.icons/pc-lyrics.icon.png"
            alt="lyrics icon"
          />
          <img
            src="assets/icons/player.icons/dinamic.icon.png"
            alt="dinamic icon"
          />
          <img src="assets/icons/homemmain.icons/dots.icon.png" alt="dots icon" />
          <img
            src="assets/icons/player.icons/vertical.line.icon.png"
            alt="vertical line icon"
          />
          <img
            src="assets/icons/player.icons/circle.icon.png"
            alt="circle icon"
          />
          <img
            src="assets/icons/player.icons/burger.icon.png"
            alt="burger icon"
          />
        </section>
      </footer>
  </div>
</body>
</html>
